name: Notion Database Backup

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Notion Data
        run: |
          curl -X POST "https://api.notion.com/v1/databases/${{ secrets.NOTION_DATABASE_ID }}/query" \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data '{}' > cd_backup.json

      - name: Convert JSON to Markdown Table
        run: |
          python - <<EOF
          import json
          try:
              with open('cd_backup.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write('# 💿 購入済みCDリスト\n\n')
                  f.write('| タイトル | アーティスト | 発売日 |\n')
                  f.write('| :--- | :--- | :--- |\n')
                  
                  results = data.get('results', [])
                  if not results:
                      f.write('| Notionからデータが届いていません | 接続設定を確認してください | |\n')
                  
                  for row in results:
                      props = row.get('properties', {})
                      
                      # 1. タイトル列（名前に関わらず'title'タイプを探す）
                      title = "不明"
                      for p in props.values():
                          if p.get('type') == 'title':
                              t_list = p.get('title', [])
                              if t_list: title = t_list[0].get('plain_text', '不明')
                              break

                      # 2. アーティスト列（名前で指定）
                      a_prop = props.get('アーティスト', {}).get('rich_text', [])
                      artist = a_prop[0].get('plain_text', '-') if a_prop else '-'
                      
                      # 3. 発売日列（名前で指定）
                      d_prop = props.get('発売日', {}).get('date')
                      date_val = d_prop.get('start', '-') if d_prop and d_prop.get('start') else '-'
                      
                      f.write(f'| {title} | {artist} | {date_val} |\n')
          except Exception as e:
              f.write(f'| エラーが発生しました: {str(e)} | | |\n')
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cd_backup.json README.md
          git commit -m "chore: update backup and list [$(date +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
